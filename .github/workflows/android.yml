name: Build Android test package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Prepare mobile web build
        run: npm run build:mobile
      - name: Add Capacitor Android project
        run: npx cap add android
      - name: Set Android version metadata
        run: node scripts/configure-android-build.cjs
      - name: Sync mobile app
        run: npx cap sync android
      - name: Build installable test APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxMan-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach Android test APK to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
