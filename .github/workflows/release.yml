name: Build Windows release assets

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and attach
        required: true
        default: v0.3.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm test
          npm run test:ui
          npm run test:phone-capture
          npm run test:pairing
          npm run test:mobile
          npm run test:restore

      - name: Build installer and portable executable
        run: npm run dist -- --publish never

      - name: Attach Windows packages to the release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --title "TaxMan $version" --generate-notes
          }
          gh release upload "$env:RELEASE_TAG" `
            "dist/TaxMan-$version-Setup.exe" `
            "dist/TaxMan-$version-Portable.exe" `
            "dist/TaxMan-$version-Setup.exe.blockmap" `
            "dist/latest.yml" `
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
