name: Build Windows release assets

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and attach
        required: true
        default: v0.3.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm test
          npm run test:ui
          npm run test:phone-capture
          npm run test:mobile
          npm run test:restore

      - name: Build installer and portable executable
        run: npm run dist -- --publish never

      - name: Attach Windows packages to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/TaxMan-*-Setup.exe
            dist/TaxMan-*-Portable.exe
            dist/TaxMan-*-Setup.exe.blockmap
            dist/latest.yml
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
