<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxMan phone capture</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #eef3f8; color: #172033; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; }
    main { width: min(520px, 100%); background: white; border: 1px solid #d8e1ea; border-radius: 18px; padding: 28px; box-shadow: 0 14px 35px rgba(18,59,99,.12); }
    h1 { margin: 0 0 8px; color: #123b63; font-size: 28px; } p { line-height: 1.5; color: #647387; }
    .button { display: block; width: 100%; border: 0; border-radius: 10px; padding: 15px 18px; background: #2878b9; color: white; font: inherit; font-weight: 700; font-size: 17px; }
    .button:disabled { opacity: .6; } .preview { display: none; width: 100%; max-height: 55vh; object-fit: contain; margin: 18px 0; border-radius: 10px; border: 1px solid #d8e1ea; background: #f7f9fb; }
    .status { min-height: 24px; margin-top: 14px; font-weight: 600; } .success { color: #167a55; } .error { color: #b33b3b; }
    .small { font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Send a bill photo to TaxMan</h1>
    <p>Take a clear photo of the whole bill. TaxMan will show it in the open transaction so you can review the details before saving.</p>
    <input id="photo" type="file" accept="image/*" capture="environment" hidden>
    <button class="button" id="choose" type="button">Take bill photo</button>
    <button class="button" id="another" type="button" hidden>Send Another Photo</button>
    <img id="preview" class="preview" alt="Bill photo preview">
    <div id="status" class="status" aria-live="polite"></div>
    <p class="small">For privacy, this temporary link works only on the same local network and expires shortly.</p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const input = document.getElementById('photo');
    const choose = document.getElementById('choose');
    const another = document.getElementById('another');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    choose.addEventListener('click', () => input.click());
    another.addEventListener('click', () => input.click());
    input.addEventListener('change', async () => {
      const file = input.files?.[0];
      if (!file) return;
      choose.disabled = true;
      status.className = 'status';
      status.textContent = 'Preparing photo…';
      try {
        const imageData = await resize(file);
        preview.src = imageData;
        preview.style.display = 'block';
        status.textContent = 'Sending to TaxMan…';
        const response = await fetch('/upload?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imageData }) });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || 'The photo could not be sent.');
        status.className = 'status success';
        status.textContent = 'Photo received. You can return to TaxMan.';
        another.hidden = false;
        choose.disabled = false;
      } catch (error) { status.className = 'status error'; status.textContent = error.message || 'The photo could not be sent.'; choose.disabled = false; }
    });
    function resize(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('The photo could not be read.'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('The photo could not be opened.'));
          image.onload = () => {
            const scale = Math.min(1, 1600 / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', .78));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
